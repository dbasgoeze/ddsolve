[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "ddsolve"
version = "0.0.1"
dependencies = ["lark", "tqdm"]

[project.scripts]
ddsolve = "ddsolve.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: full program verification tests that can take a long time (run with `-m slow`)"]

[dependency-groups]
dev = ["pytest"]

[tool.scikit-build]
wheel.packages = []
wheel.py-api = "cp312"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
SMT_SOLVER = "CVC5"
